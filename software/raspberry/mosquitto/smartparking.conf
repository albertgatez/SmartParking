# SmartParking - configuración de Mosquitto
# Copiar a /etc/mosquitto/conf.d/smartparking.conf
#
# El mosquitto.conf principal de Debian ya activa la persistencia
# (persistence / persistence_location) e incluye esta carpeta conf.d;
# no se repiten aquí porque Mosquitto marca error si se duplican.

listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

log_dest syslog
log_type error
log_type warning
log_type notice
connection_messages true
